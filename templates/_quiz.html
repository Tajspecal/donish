<section id="view-quiz" class="view" hidden>
    <div class="quiz">
        <div class="quiz__top">
            <button class="btn btn--ghost" id="btn-exit">← Выйти из теста</button>
            <span id="quiz-counter" class="quiz__counter"></span>
            <span id="quiz-timer" class="quiz__timer" role="timer" aria-live="off" hidden></span>
        </div>
        <h2 id="quiz-title" class="quiz__title"></h2>
        <div class="progress"><div id="progress-bar" class="progress__bar"></div></div>
        <div class="card question">
            <p id="question-text" class="question__text"></p>
            <div id="options" class="options"></div>
        </div>
        <div class="quiz__nav">
            <button class="btn btn--secondary" id="btn-prev">Назад</button>
            <button class="btn btn--primary" id="btn-next">Далее</button>
        </div>
    </div>
</section>
